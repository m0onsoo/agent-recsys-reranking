[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reranking-bench"
version = "0.1.0"
description = "Reproducible LLM-agent reranking experiments"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-reranking = "agent_reranking.cli:main"

[tool.setuptools.packages.find]
include = ["agent_reranking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

